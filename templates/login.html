<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 약국 순익 관리</title>
    {% include '_auth_style.html' %}
</head>
<body>
    <div class="card login-card p-4 bg-white">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                <span aria-hidden="true">✚</span>
            </div>
            <h4 class="fw-bold mb-1">약국 순익 관리 시스템</h4>
            <span class="text-muted small">약국 전용 매출·조제·순익 스마트 장부</span>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold">아이디</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><span aria-hidden="true">•</span></span>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" placeholder="아이디 입력" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-bold">비밀번호</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><span aria-hidden="true">•</span></span>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
                로그인
            </button>
        </form>

        <div class="text-center pt-3 border-top">
            <span class="text-muted small">아직 계정이 없으신가요?</span>
            <a href="/register" class="fw-bold text-decoration-none ms-1 small">약국 회원가입</a>
        </div>
    </div>

</body>
</html>
