<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약국 회원가입 - 약국 순익 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        }
        .register-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 440px;
        }
    </style>
</head>
<body>
    <div class="card register-card p-4 bg-white">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
                <i class="fas fa-plus-circle fa-2x"></i>
            </div>
            <h4 class="fw-bold mb-1">약국 회원가입</h4>
            <span class="text-muted small">우리 약국만의 독립된 순익 장부를 만듭니다</span>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show py-2 small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="mb-3">
                <label for="pharmacy_name" class="form-label small fw-bold">약국 이름</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-store text-muted"></i></span>
                    <input type="text" class="form-control" id="pharmacy_name" name="pharmacy_name" placeholder="예: 온누리행복약국" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label small fw-bold">아이디</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="영문/숫자 아이디" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-bold">비밀번호</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호 설정" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mb-3">
                가입하고 바로 시작하기
            </button>
        </form>

        <div class="text-center pt-3 border-top">
            <span class="text-muted small">이미 계정이 있으신가요?</span>
            <a href="/login" class="fw-bold text-decoration-none ms-1 small">로그인하기</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
