name: Align warm dashboard miscellaneous query budget
on:
  push:
    branches: [feature-extra-profit-ledger-20260920]
permissions:
  contents: write
jobs:
  patch:
    if: "github.event.head_commit.message == 'build: reconcile warm dashboard extra query contract'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-extra-profit-ledger-20260920
      - name: Assert previous base budget and one new miscellaneous lookup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_analysis.py')
          source=p.read_text(encoding='utf-8')
          old='    assert len(statements) <= 2, statements'
          new="    base_queries = [sql for sql in statements if 'extra_profit' not in sql]\n    misc_queries = [sql for sql in statements if 'extra_profit' in sql]\n    assert len(base_queries) <= 2, statements\n    assert len(misc_queries) <= 1, statements"
          assert source.count(old)==1
          p.write_text(source.replace(old,new),encoding='utf-8')
          PY
          git diff --check
          git diff --stat
      - name: Commit refined regression test
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/test_analysis.py
          git commit -m 'test: preserve warm base query budget and allow misc source'
          git push origin HEAD:feature-extra-profit-ledger-20260920
