name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node --test tests/test_ocr_loader.cjs
      - name: Production server smoke test
        shell: bash
        run: |
          gunicorn -c gunicorn.conf.py -b 127.0.0.1:8765 app:app > /tmp/pharmacy-gunicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              curl -fsS http://127.0.0.1:8765/login >/dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pharmacy-gunicorn.log
          exit 1
