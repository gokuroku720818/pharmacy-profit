name: Fix cross-block Jinja variable scope
on:
  push:
    branches: [ui-three-profit-components-20260920]
permissions:
  contents: write
jobs:
  fix-once:
    if: "github.event.head_commit.message == 'build: fix template scope in three-view PR'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-three-profit-components-20260920
      - name: Fix two undefined expressions without changing financial logic
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          changes = {
              'templates/dashboard.html': (
                  'const currentMonth = {{ split|tojson }};',
                  'const currentMonth = {{ components_for(current_month.year, current_month.month, current_month.dispensing_plus_daily, current_month.non_insurance, current_month.grand_total)|tojson }};'),
              'templates/report.html': (
                  'const annualSplit = {{ annual_split|tojson }};',
                  'const annualSplit = {{ period_components(selected_year, report_data)|tojson }};'),
          }
          for path, (before, after) in changes.items():
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              assert text.count(before) == 1, path
              file.write_text(text.replace(before, after, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- templates/dashboard.html templates/report.html
          git commit -m 'fix: compute chart data in scripts block scope'
          git push origin HEAD:ui-three-profit-components-20260920
