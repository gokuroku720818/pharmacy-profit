name: Align incidental profit test fixtures once
on:
  push:
    branches: [feature-extra-profit-ledger-20260920]
permissions:
  contents: write
jobs:
  align:
    if: "github.event.head_commit.message == 'build: fix test fixture workflow YAML indentation'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-extra-profit-ledger-20260920
      - name: Update specific fixture assertions without weakening base budget
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def exact(path, old, new):
              file=Path(path)
              text=file.read_text(encoding='utf-8')
              assert text.count(old)==1, (path, text.count(old))
              file.write_text(text.replace(old,new),encoding='utf-8')
          exact('tests/test_analysis.py', '        assert len(statements) <= 3, statements', "        base_queries = [sql for sql in statements if 'extra_profit' not in sql]\n        misc_queries = [sql for sql in statements if 'extra_profit' in sql]\n        assert len(base_queries) <= 3, statements\n        assert len(misc_queries) <= 2, statements")
          path=Path('tests/test_profit_display.py')
          source=path.read_text(encoding='utf-8')
          target=next(line for line in source.splitlines() if 'INSERT INTO daily_profit VALUES' in line)
          assert source.count(target)==1
          extra="    conn.execute('CREATE TABLE extra_profit (user_id INTEGER, date TEXT, amount INTEGER)')"
          path.write_text(source.replace(target, target+'\n'+extra),encoding='utf-8')
          exact('tests/test_profit_display.py', '        assert len(calls) == 1', '        assert len(calls) == 2  # daily + miscellaneous source, each reused')
          exact('tests/test_three_profit_asset_version.py', "v='three-profit-20260920'", "v='extra-profit-20260920'")
          PY
          git diff --check
          git diff --stat
      - name: Commit updated fixture contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/test_analysis.py tests/test_profit_display.py tests/test_three_profit_asset_version.py
          git diff --cached --quiet && exit 1
          git commit -m 'test: include two supplemental source lookups in query budget'
          git push origin HEAD:feature-extra-profit-ledger-20260920
