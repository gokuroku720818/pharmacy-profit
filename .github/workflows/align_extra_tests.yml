name: Align incidental profit test fixtures once
on:
  push:
    branches: [feature-extra-profit-ledger-20260920]
permissions:
  contents: write
jobs:
  align:
    if: "github.event.head_commit.message == 'build: align misc profit regression fixtures'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-extra-profit-ledger-20260920
      - name: Preserve original query budget while accounting for new source
        run: |
          python - <<'PY'
          from pathlib import Path
          def exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              assert text.count(old) == 1, (path,old[:50],text.count(old))
              p.write_text(text.replace(old,new), encoding='utf-8')
          exact('tests/test_analysis.py', '        assert len(statements) <= 3, statements', "        base_queries = [sql for sql in statements if 'extra_profit' not in sql]\n        misc_queries = [sql for sql in statements if 'extra_profit' in sql]\n        assert len(base_queries) <= 3, statements\n        assert len(misc_queries) <= 2, statements")
          exact('tests/test_profit_display.py', '''    conn.execute("INSERT INTO daily_profit VALUES (1, '2026-08-01', 120, 70, 30, 220)")''', '''    conn.execute("INSERT INTO daily_profit VALUES (1, '2026-08-01', 120, 70, 30, 220)")
    conn.execute('CREATE TABLE extra_profit (user_id INTEGER, date TEXT, amount INTEGER)')''')
          exact('tests/test_profit_display.py', '        assert len(calls) == 1', '        assert len(calls) == 2  # one daily source + one optional miscellaneous source')
          exact('tests/test_three_profit_asset_version.py', "v='three-profit-20260920'", "v='extra-profit-20260920'")
          PY
          git diff --check
          git diff --stat
      - name: Commit test fixture updates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/test_analysis.py tests/test_profit_display.py tests/test_three_profit_asset_version.py
          git commit -m 'test: account for supplemental ledger queries and asset release'
          git push origin HEAD:feature-extra-profit-ledger-20260920
