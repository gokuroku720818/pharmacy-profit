name: Apply verified three-component view patch

on:
  push:
    branches: [ui-three-profit-components-20260920]

permissions:
  contents: write

jobs:
  apply-once:
    if: "github.event.head_commit.message == 'build: activate three-component UI patch'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-three-profit-components-20260920
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded exact-anchor view edits
        run: |
          set -euo pipefail
          python tools/apply_three_profit_view.py
          python -m compileall -q app.py profit_components.py profit_display.py tools/apply_three_profit_view.py
          node --check static/js/charts.js
          git diff --check
          git diff --stat
      - name: Commit only changed app and view source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.py templates/dashboard.html templates/calendar.html templates/report.html templates/trend.html static/js/charts.js
          git diff --cached --quiet && { echo 'No view edits produced'; exit 1; }
          git commit -m 'feat: apply verified three-way profit display to views'
          git push origin HEAD:ui-three-profit-components-20260920
