name: Finalize three-profit chart assets

on:
  push:
    branches: [ui-three-profit-components-20260920]

permissions:
  contents: write

jobs:
  one-time-fix:
    if: "github.event.head_commit.message == 'build: perform isolated chart cache version fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-three-profit-components-20260920
      - name: Update only chart script URL without changing line endings
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          base = Path('templates/base.html')
          text = base.read_text(encoding='utf-8')
          old = "url_for('static', filename='js/charts.js')"
          new = "url_for('static', filename='js/charts.js', v='three-profit-20260920')"
          assert text.count(old) == 1
          base.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check -- templates/base.html
          git diff --stat -- templates/base.html
      - name: Commit and push chart URL fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- templates/base.html
          git diff --cached --quiet && { echo 'No changes found'; exit 1; }
          git commit -m 'fix: version chart JS to bypass stale browser cache'
          git push origin HEAD:ui-three-profit-components-20260920
